services:
  ma-co:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - CREWAI_MOCK=${CREWAI_MOCK:-1}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - MAX_PAYLOAD_BYTES=${MAX_PAYLOAD_BYTES:-1048576}
      - MA_CO_STORE_BACKEND=${MA_CO_STORE_BACKEND:-local}
      - MA_CO_LLM_PROVIDER=${MA_CO_LLM_PROVIDER:-fixture}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  mongo:
    image: mongo:7
    profiles: ["mongo"]
    ports:
      - "27017:27017"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.115.0
    profiles: ["observability"]
    ports:
      - "4318:4318"
    restart: unless-stopped
