[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "multi-agent-conversational-orchestration"
version = "0.1.0"
description = "Policy-gated incident triage with CrewAI and LangGraph adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]
[project.optional-dependencies]
crewai = ["crewai>=0.100,<2"]
langgraph = ["langgraph>=0.2,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/ma_co"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
