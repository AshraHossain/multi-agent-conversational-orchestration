[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-conversational-orchestration"
version = "0.2.0"
description = "Policy-gated incident triage with CrewAI and LangGraph adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
crewai = ["crewai>=0.100,<2"]
langgraph = ["langgraph>=0.2,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.11,<2",
    "langgraph>=0.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_co"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast offline unit tests with deterministic inputs and mocks",
    "integration: API, CLI, and end-to-end pipeline tests using offline test doubles",
    "live: tests requiring live BYNARA_API_KEY credentials",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "src/ma_co/adapters/"]
