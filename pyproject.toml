[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-conversational-orchestration"
version = "0.3.0"
description = "Policy-gated incident triage with CrewAI, LangGraph, streaming, and Incident Cockpit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
crewai = ["crewai>=0.100,<2"]
langgraph = ["langgraph>=0.2,<2"]
genai = ["google-genai>=1.0,<2"]
mongo = ["pymongo>=4.8,<5"]
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp>=1.27,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.11,<2",
    "langgraph>=0.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_co"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast offline unit tests with deterministic inputs and mocks",
    "integration: API, CLI, and end-to-end pipeline tests using offline test doubles",
    "live: tests requiring live BYNARA_API_KEY or GOOGLE_API_KEY credentials",
    "slow: full-matrix or multi-repetition benchmarks",
]
addopts = "-m 'not live' -p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["src/ma_co"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
