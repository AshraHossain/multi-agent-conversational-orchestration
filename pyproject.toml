[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "multi-agent-conversational-orchestration"
version = "0.1.0"
description = "Policy-gated incident triage with CrewAI and LangGraph adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]
[project.optional-dependencies]
crewai = ["crewai>=0.100,<2"]
langgraph = ["langgraph>=0.2,<2"]
genai = ["google-generativeai>=0.8,<1"]
mongo = ["pymongo>=4.9,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.8,<1", "langgraph>=0.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_co"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no I/O",
    "integration: may touch disk",
    "live: requires real API credentials",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "S", "B", "I"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.coverage.run]
source = ["ma_co"]
omit = [
    "*/adapters/genai_adapter.py",
    "*/adapters/mongo_store.py",
    "*/cli.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
