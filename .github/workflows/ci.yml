name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --group dev --extra langgraph
      - name: Lint
        run: uv run ruff check src tests
      - name: Test (offline only, 80% coverage gate)
        run: uv run pytest -m "not live" --cov=ma_co --cov-report=term-missing --cov-fail-under=80
      - name: Eval harness
        run: uv run python -m ma_co.eval
