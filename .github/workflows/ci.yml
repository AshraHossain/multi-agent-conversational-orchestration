name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy src/ma_co
      - run: uv run pytest --cov=ma_co --cov-report=term-missing --cov-fail-under=80
      - run: uv run python -m ma_co.eval

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ma-co:ci .
